<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- بروتوكول الأمان: نفس سياسة الصفحة الرئيسية — حماية صارمة ضد الحقن -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src https://accounts.google.com; child-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>لوحة التحكم — جامع الروابط</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0a192f" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f1c40f'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='%230a192f' font-family='sans-serif' font-weight='bold'%3E%E2%9A%99%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&display=swap" rel="stylesheet" />
<!-- نظام اللغتين (تُجبر اللوحة على العربية داخل i18n.js) -->
<script src="assets/js/i18n.js" integrity="sha384-qttFwOy1VEbsUULNT5bqm6uu2xSn+VS2cpdc1cI/V+NONhBaNSAIRtobVPp4RnZt"></script>
<link rel="stylesheet" href="assets/css/style.css"          integrity="sha384-Ao3DgNBleGazbrmENkmXNgOghCTSYTZF8xfbaa6kdCQ2HXgrSNjgFU3za2yZU+LX" />
<style>
  .admin-shell { max-width: 1180px; margin: 0 auto; padding: 1.5rem; }
  .admin-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .admin-head h1 { font-size: 1.6rem; font-weight: 900; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-box { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; }
  .stat-box b { display: block; font-size: 1.8rem; font-weight: 900; color: var(--accent); }
  .stat-box span { font-size: .82rem; color: var(--muted); }
  .badge-pending { background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--gold); border: 1px solid var(--gold); padding: .12rem .5rem; border-radius: 999px; font-size: .72rem; font-weight: 800; }
  .badge-ok { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border: 1px solid var(--accent); padding: .12rem .5rem; border-radius: 999px; font-size: .72rem; font-weight: 800; }
  .badge-no { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); border: 1px solid var(--danger); padding: .12rem .5rem; border-radius: 999px; font-size: .72rem; font-weight: 800; }
  .lock-box { text-align: center; padding: 3rem 1.5rem; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); max-width: 460px; margin: 3rem auto; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js" defer></script>
</head>
<body>
<header class="site-header" style="padding:2.5rem 1.5rem 2rem">
  <h1 style="font-size:1.8rem">⚙️ لوحة تحكم جامع الروابط</h1>
  <p class="header-tagline">أضف وعدّل واحذف المواقع — التحديث اليدوي للمحتوى</p>
</header>

<div class="admin-shell">
  <div class="lock-box" id="lockBox">
    <div style="font-size:3rem;margin-bottom:.5rem">🔐</div>
    <h2 style="font-size:1.2rem;margin-bottom:.5rem">هذه الصفحة للمشرفين فقط</h2>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:1.25rem">سجّل الدخول بحساب جوجل المصرّح له</p>
    <button class="google-btn" id="lockLogin">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.7l7.8 6.1C12.3 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.2-.4-4.7H24v9h12.6c-.5 2.6-2.1 4.9-4.4 6.4l6.7 6.7c3.9-3.6 6.6-9 6.6-17.4z"/><path fill="#FBBC05" d="M10.4 28.2c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4l-7.8-6.1C.9 16.2 0 19.9 0 23.8s.9 7.6 2.6 10.5l7.8-6.1z"/><path fill="#34A853" d="M24 47.5c6.2 0 11.5-2 15.3-5.5l-6.7-6.7c-1.8 1.2-4.2 2-7.6 2-5.9 0-10.9-3.9-12.7-9.3l-7.8 6.1C10.3 42.9 17.2 47.5 24 47.5z"/></svg>
      الدخول بحساب جوجل
    </button>
    <div id="lockMsg" style="margin-top:1rem"></div>
  </div>

  <div id="adminArea" style="display:none">
    <div class="admin-head">
      <div>
        <h1 id="welcome">مرحباً</h1>
        <p style="color:var(--muted);font-size:.88rem" id="adminEmail"></p>
      </div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="exportBtn">📊 تصدير المستخدمين (CSV)</button>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">تسجيل الخروج</button>
        <a class="btn btn-ghost btn-sm" href="index.html">← الموقع</a>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-box"><b id="sTotal">0</b><span>إجمالي الروابط</span></div>
      <div class="stat-box"><b id="sPending">0</b><span>بانتظار المراجعة</span></div>
      <div class="stat-box"><b id="sApproved">0</b><span>معتمدة</span></div>
      <div class="stat-box"><b id="sUsers">0</b><span>المستخدمون</span></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="pending">طلبات الزوار</button>
      <button class="tab" data-tab="add">إضافة رابط</button>
      <button class="tab" data-tab="manage">إدارة الروابط</button>
      <button class="tab" data-tab="users">المستخدمون</button>
    </div>

    <section id="tab-pending" class="tabpane">
      <div id="pendingList"></div>
    </section>

    <section id="tab-add" class="tabpane" style="display:none">
      <div class="panel" style="margin-top:0">
        <h2 class="panel-title">➕ إضافة رابط جديد</h2>
        <div class="form-row two">
          <div><label class="field-label" for="aTitle">اسم الموقع</label>
            <input class="input" id="aTitle" maxlength="120" /></div>
          <div><label class="field-label" for="aUrl">الرابط</label>
            <input class="input" id="aUrl" type="url" dir="ltr" placeholder="https://" /></div>
        </div>
        <div class="form-row two" style="margin-top:.75rem">
          <div><label class="field-label" for="aCat">القسم</label>
            <select class="select" id="aCat"></select></div>
          <div><label class="field-label" for="aLang">اللغة</label>
            <select class="select" id="aLang"><option value="ar">عربي</option><option value="en">English</option></select></div>
        </div>
        <div style="margin-top:.75rem"><label class="field-label" for="aDesc">الوصف</label>
          <textarea class="textarea" id="aDesc" maxlength="400"></textarea></div>
        <div class="form-row two" style="margin-top:.75rem">
          <div><label class="field-label" for="aTier">النوع</label>
            <select class="select" id="aTier"><option value="free">مجاني</option><option value="paid">مدفوع</option></select></div>
          <div><label class="field-label" for="aVotes">عدد الأصوات (ترتيب)</label>
            <input class="input" id="aVotes" type="number" value="100" min="0" /></div>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:1rem" id="addBtn">حفظ ونشر</button>
        <div id="addMsg" style="margin-top:.75rem"></div>
      </div>
    </section>

    <section id="tab-manage" class="tabpane" style="display:none">
      <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap">
        <input class="input" id="manageSearch" placeholder="ابحث في الروابط…" style="max-width:320px" />
        <select class="select" id="manageFilter" style="max-width:220px"></select>
      </div>
      <div class="table-wrap" id="manageTable"></div>
    </section>

    <section id="tab-users" class="tabpane" style="display:none">
      <div class="table-wrap" id="usersTable"></div>
    </section>
  </div>
</div>

<script src="assets/js/config.js" integrity="sha384-nGgKx6gnI5F52vY11iZZFq+eUvkgESvGH345jvrRvrYxkeljiWuCiFbFLnPLYc/L"></script>
<script src="assets/js/data.js" integrity="sha384-wSnF85q9RLRj272psoB1+nkJUJwGL8i0iX64MrPtArLmiM3twsuWgVCtAuzXlLHK"></script>
<script src="assets/js/data-layer.js" integrity="sha384-Ly3TdIahk/CFgwSxLULfyX17d0hpufh6ZOhgAssSPoqNh8qzpoYPvvQz0k+k6JVG"></script>
<script src="assets/js/admin.js" integrity="sha384-3by/qvB0hErcAjloZ2zSIitsZ2vnAyESUIA6Rgy2wMkFWoUMmL43KX10m5y5wSUx"></script>
<script src="assets/js/security.js" integrity="sha384-2JWxqQNnGK+TWJ12nZV4/+nr2Rwdwbc9NlpRccod6APrRXe5JbkqKLczMg3KweW6"></script>
</body>
</html>
